<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">


    <title>CommonThread | Welcome</title>
</head>
<body>
    <nav>  
        <div class="logo"> 
            <a href="{{ url_for('index') }}">
                Common<span>Thread</span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href ="{{ url_for('dashboard') }}">Home</a></li>
            <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
            <li><a href="{{ url_for('signup') }}" class="bigItem">Sign Up</a></li>
            <li><a href="{{ url_for('login') }}" class="bigItem">Login</a></li>
        </ul>

    </nav>

    <section class="content">
        <h3>Requested Activities</h3>
        <style>
            .scroll-box {
                width: 300px;
                height: 200px;       
                overflow-y: auto;     
                border: 2px solid #000000;
                padding: 10px;
                background-color: #ffffff;
            }

            .item-row {
                padding: 8px;
                border-bottom: 1px solid #000000;
                display: block;   
            }
        </style>
        <div class="scroll-box">
            {% for item in activities %}
                <span class="item-row">
                    {{ item[1] }}:{{ item[2] }}
                </span>
            {% endfor %}
        </div>
                <div class="scroll-box">
            {% for item in requests %}
                <span class="item-row">
                    {{ item[2] }}:{{ item[3] }}
                </span>
            {% endfor %}
        </div>
    </section>
    <form id="ActivityForm" method="POST" action="/admin">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="title" id="title" name="title" placeholder="Enter title" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <input type="description" id="description" name="description" placeholder="Enter description" required>
    </div>

    <button type="submit" class="signup-button">Create</button>
  </form>
</body>

    <!-- Footer -->
    <footer class="footerCopy">
        <p>Copyright &copy; 2026 CommonThread. All rights reserved.</p>
    </footer>
<script src="/static/js/main.js"></script>
</html>
