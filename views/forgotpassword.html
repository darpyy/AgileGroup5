<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
 
        <div class="login-header">
            <h1>Change password</h1>
            <p>Enter your current and new password below</p>
        </div>
 
        <form method="POST" action="/change-password">
 
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" placeholder="Enter your current password" required>
            </div>
 
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required>
            </div>
 
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your new password" required>
            </div>
 
            <button type="submit" class="login-button">Update Password</button>
 
        </form>
 
        <p class="signup-text">
            <a href="/login">Back to login</a>
        </p>
 
    </div>
</body>
</html>
