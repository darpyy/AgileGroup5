<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/css/global.css" />
    <link rel="stylesheet" href="/static/css/homepage.css" />

    <title>CommonThread | Homepage</title>
  </head>
  <body>
    <nav>  
    <div class="logo"> 
        <a href="{{ url_for('index') }}">
            Common<span>Thread</span>
        </a>
    </div>
    <ul class="nav-links">
        <li><a href ="{{ url_for('homepage') }}" class = "active">Home</a></li>
        <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
        <li><a href="{{ url_for('about') }}">About Us</a></li>
        <li><a href="{{ url_for('login') }}">Login</a></li>
        <li><a href="{{ url_for('signup') }}">Sign Up</a></li>
    </ul>
    </nav>
    <h1>Hello {{ username }}</h1>
    <h3 class = "form-header"> Got a forum we don't have? Make a request right here!</h3>

    <form id="forumRequestForm" method="POST" action="/request_forum">
      <div class="form-group">
        <label for="forumName">Forum Name</label>
        <input
          type="text"
          id="forumName"
          name="forumName"
          size="50"
          placeholder="Enter the name of the forum you want to request"
          required/>
          <br>

        <label for="forumDescription">Forum Description</label>
        <textarea
          id="forumDescription"
          name="forumDescription"
          rows="4"
          cols="50"
          placeholder="Enter a brief description of the forum you want to request and reason for the request"
          required></textarea>
      </div>

      <button type="submit" class="btn form-button">Submit Request</button>
    </form>
  </body>


  <footer>
    <p>Copyright &copy; 2026 CommonThread. All rights reserved.</p>
  </footer>
</html>
