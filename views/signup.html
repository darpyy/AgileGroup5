<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/signup.css">



    <title>CommonThread | Sign Up</title>
</head>
<body>
    <nav>  
        <div class="logo"> 
            <a href="{{ url_for('index') }}">
                Common<span>Thread</span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href ="{{ url_for('homepage') }}">Home</a></li>
            <li><a href="{{ url_for('contact') }}">Contact Us</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
            <li><a href="{{ url_for('login') }}">Login</a></li>
            <li><a href="{{ url_for('signup') }}" class="active">Sign Up</a></li>
        </ul>
    </nav>

    <div class="signup-container">
    <div class="signup-header">
    <h1>Create an account</h1>
    <p>Please fill in this form to create your account</p>
  </div>

  <form id="signupForm" method="POST" action="/signup">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
    </div>

    <button type="submit" class="btn form-button">Sign Up</button>
  </form>

  <div class="divider"><span>or</span></div>

  <p class="login-text">
    Already have an account? <a href="login.html">Sign in</a>
  </p>
</div>
</body>
</html>
